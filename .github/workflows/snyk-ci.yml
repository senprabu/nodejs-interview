name: snyk-ci

#pull_request: run on every PR (so you get security feedback before merge).
#push → branches: ["main", "snyk-demo"] run on any push to main or snyk-demo
on:
  pull_request:
  push:
    branches: ["main", "snyk-demo"]

#Jobs → snyk-scan → runs-on: ubuntu-latest
#Create one job called snyk-scan on a fresh Ubuntu VM.
jobs:
  snyk-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # for SARIF upload (optional)

      #Pulls your repository files into the runner so other steps can use them.  
    steps:
      - name: Checkout
        uses: actions/checkout@v4

        #Installs Node.js v20 on the runner (needed for npm, npx, and many JS projects).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

        #Installs a clean, lockfile-exact set of packages. --legacy-peer-deps avoids strict peer-dep conflicts that can break CI.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

        #Logs the Snyk CLI into your Snyk account using a repository secret called SNYK_TOKEN
      - name: Snyk auth
        run: npx snyk auth ${{ secrets.SNYK_TOKEN }}

        #Scans for vulnerabilities. If High (or Critical) issues are found, the step fails and the build is blocked
      - name: Snyk test (gate build)
        run: npx snyk test --severity-threshold=high --all-projects

        #Uploads a snapshot so issues appear in the Snyk web UI for tracking over time
      - name: Snyk monitor (snapshot to Snyk)
        if: always()
        run: npx snyk monitor --all-projects

        #Generate SARIF for GitHub Security
      - name: Generate SARIF (Snyk)
        run: |
         npx snyk test \
          --all-projects \
          --severity-threshold=high \
          --sarif \
          --sarif-file-output=./sarif.json \
          -q || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

        #Verify the SARIF file is valid
      - name: Verify SARIF exists and is JSON
        run: |
         ls -la
         head -n 3 sarif.json
         jq -e . sarif.json >/dev/null

        #Upload SARIF to GitHub
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif.json
        # eof



